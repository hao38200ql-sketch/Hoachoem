<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khu vườn hoa dành tặng em</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#2e1f4d;font-family:"Be Vietnam Pro",system-ui,sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
.ui{position:fixed;left:0;right:0;text-align:center;color:#fff;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.6)}
#hint{bottom:calc(46px + env(safe-area-inset-bottom,0px));font-size:15px;transition:opacity .6s;padding:0 16px}
#count{bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.85}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="hint" class="ui">Chạm vào tấm thiệp để mở nhé Nhi</div>
<div id="count" class="ui"></div>
<div id="err">Trình duyệt của bạn chưa hỗ trợ WebGL, hãy thử mở bằng Chrome hoặc Safari mới hơn.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Sửa tên ở đây */
var TO="Gửi em Ngọc Nhi,", FROM="Hào";

(function(){
var T=THREE, rnd=function(a,b){return a+Math.random()*(b-a)};
var renderer;
try{renderer=new T.WebGLRenderer({antialias:true})}catch(e){document.getElementById("err").style.display="flex";return}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=T.sRGBEncoding;
document.body.appendChild(renderer.domElement);
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Cảnh, trời, sương */
var scene=new T.Scene(),cam=new T.PerspectiveCamera(50,1,.1,200);
var sk=document.createElement("canvas");sk.width=4;sk.height=256;
var sx=sk.getContext("2d"),gr=sx.createLinearGradient(0,0,0,256);
gr.addColorStop(0,"#120f2b");gr.addColorStop(.55,"#2e1f4d");gr.addColorStop(1,"#7a4a6c");
sx.fillStyle=gr;sx.fillRect(0,0,4,256);
var skyTex=new T.CanvasTexture(sk);skyTex.encoding=T.sRGBEncoding;
scene.background=skyTex;
scene.fog=new T.FogExp2(0x4a2f5e,.045);

/* Ánh sáng */
scene.add(new T.HemisphereLight(0xb9a7ff,0x2a4a35,.7));
var moonL=new T.DirectionalLight(0xdfe6ff,.7);moonL.position.set(-6,10,-8);scene.add(moonL);
var warm=new T.PointLight(0xffd3a0,0,9);warm.position.set(0,1.8,1.8);scene.add(warm);

/* Sao, trăng */
var sp=[];for(var i=0;i<500;i++){var a=rnd(0,6.283),b=rnd(.1,1.3),r=70;sp.push(Math.cos(a)*Math.sin(b)*r,Math.cos(b)*r*.8+4,Math.sin(a)*Math.sin(b)*r)}
var sg=new T.BufferGeometry();sg.setAttribute("position",new T.Float32BufferAttribute(sp,3));
scene.add(new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:.45,fog:false,sizeAttenuation:true})));
function glowTex(c){var k=document.createElement("canvas");k.width=k.height=64;var x=k.getContext("2d"),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,c);g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(k)}
var moon=new T.Mesh(new T.SphereGeometry(2.2,24,24),new T.MeshBasicMaterial({color:0xfff3d6,fog:false}));
moon.position.set(-18,20,-45);scene.add(moon);
var halo=new T.Sprite(new T.SpriteMaterial({map:glowTex("rgba(255,240,200,.9)"),fog:false,transparent:true,opacity:.5,depthWrite:false}));
halo.scale.set(22,22,1);halo.position.copy(moon.position);scene.add(halo);

/* Mặt đất + cỏ */
var gg=new T.PlaneGeometry(70,70,70,70);gg.rotateX(-Math.PI/2);
var pos=gg.attributes.position;
for(var i=0;i<pos.count;i++){var x=pos.getX(i),z=pos.getZ(i),d=Math.hypot(x,z);pos.setY(i,d>9?(d-9)*.07*(Math.sin(x*.4)+Math.cos(z*.35)+1.6):0)}
gg.computeVertexNormals();
scene.add(new T.Mesh(gg,new T.MeshStandardMaterial({color:0x254a36,roughness:1})));
var N=2200,grass=new T.InstancedMesh(new T.ConeGeometry(.035,.4,3),new T.MeshStandardMaterial({color:0xffffff,roughness:1}),N),dm=new T.Object3D(),col=new T.Color();
for(var i=0;i<N;i++){var rr=Math.sqrt(Math.random())*15,aa=rnd(0,6.283);
 dm.position.set(Math.cos(aa)*rr,.18,Math.sin(aa)*rr);dm.rotation.set(rnd(-.25,.25),rnd(0,6),rnd(-.25,.25));dm.scale.set(1,rnd(.6,1.5),1);dm.updateMatrix();
 grass.setMatrixAt(i,dm.matrix);col.setHSL(rnd(.27,.36),.5,rnd(.2,.34));grass.setColorAt(i,col)}
scene.add(grass);

/* Đom đóm */
var FN=90,fp=new Float32Array(FN*3),fb=[];
for(var i=0;i<FN;i++){var b=[rnd(-9,9),rnd(.4,3.2),rnd(-9,9),rnd(0,6.28),rnd(.4,1)];fb.push(b)}
var fg=new T.BufferGeometry();fg.setAttribute("position",new T.BufferAttribute(fp,3));
var flies=new T.Points(fg,new T.PointsMaterial({map:glowTex("rgba(255,240,150,1)"),size:.35,transparent:true,depthWrite:false,blending:T.AdditiveBlending}));
scene.add(flies);

/* Thiệp 3D */
function wrap(x,t,px,py,w,lh){var ws=t.split(" "),l="";for(var i=0;i<ws.length;i++){var s=l?l+" "+ws[i]:ws[i];if(x.measureText(s).width>w&&l){x.fillText(l,px,py);py+=lh;l=ws[i]}else l=s}x.fillText(l,px,py);return py+lh}
function petalsDraw(x,cx,cy,sz,c1,c2){for(var i=0;i<8;i++){x.save();x.translate(cx,cy);x.rotate(i*Math.PI/4);x.fillStyle=c1;x.beginPath();x.ellipse(0,-sz*.6,sz*.28,sz*.55,0,0,6.283);x.fill();x.restore()}x.fillStyle=c2;x.beginPath();x.arc(cx,cy,sz*.28,0,6.283);x.fill()}
function tex(c){var t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;return t}
var inMat=new T.MeshStandardMaterial({color:0xfff7f1,roughness:.9}),frMat=new T.MeshStandardMaterial({color:0xffc0cb,roughness:.7});
function paint(){
 var c=document.createElement("canvas");c.width=640;c.height=860;var x=c.getContext("2d");
 x.fillStyle="#fff7f1";x.fillRect(0,0,640,860);x.strokeStyle="#f0c9cf";x.lineWidth=3;x.strokeRect(22,22,596,816);
 x.fillStyle="#c2415f";x.font='600 64px "Dancing Script",cursive';x.fillText(TO,56,115);
 x.fillStyle="#3b2a3a";x.font='300 27px "Be Vietnam Pro",sans-serif';
 var y=185;
 y=wrap(x,"Anh không có một khu vườn thật để tặng em, nên anh trồng một khu vườn ở đây.",56,y,528,40)+12;
 y=wrap(x,"Anh thích nụ cười buổi sáng, hỏi em ăn cơm chưa”.",56,y,528,40)+12;
 wrap(x,"Em chạm xuống mặt đất để trồng thêm hoa nhé. Anh sẽ cố gắng để khu vườn này luôn đầy hoa.",56,y,528,40);
 x.fillStyle="#c2415f";x.font='600 46px "Dancing Script",cursive';x.textAlign="right";x.fillText(FROM,584,800);
 inMat.map=tex(c);inMat.needsUpdate=true;
 var f=document.createElement("canvas");f.width=640;f.height=860;var y2=f.getContext("2d");
 var g=y2.createLinearGradient(0,0,640,860);g.addColorStop(0,"#ffd9de");g.addColorStop(1,"#ff9fb4");y2.fillStyle=g;y2.fillRect(0,0,640,860);
 y2.strokeStyle="rgba(255,255,255,.7)";y2.lineWidth=4;y2.strokeRect(30,30,580,800);
 petalsDraw(y2,320,330,150,"#c2415f","#fff0c2");
 y2.fillStyle="#8f2a45";y2.textAlign="center";y2.font='600 110px "Dancing Script",cursive';y2.fillText("Tặng em",320,620);
 y2.font='300 28px "Be Vietnam Pro",sans-serif';y2.fillText("Chạm để mở thiệp",320,700);
 frMat.map=tex(f);frMat.color.set(0xffffff);frMat.needsUpdate=true;
}
var card=new T.Group();
card.add(new T.Mesh(new T.BoxGeometry(1.5,2,.03),new T.MeshStandardMaterial({color:0xf3d9d3,roughness:.9})));
var inner=new T.Mesh(new T.PlaneGeometry(1.46,1.96),inMat);inner.position.z=.0155;card.add(inner);
var pivot=new T.Group();pivot.position.set(-.75,0,.025);card.add(pivot);
var front=new T.Mesh(new T.PlaneGeometry(1.5,2),frMat);front.position.set(.75,0,.002);pivot.add(front);
var back=new T.Mesh(new T.PlaneGeometry(1.5,2),new T.MeshStandardMaterial({color:0xf3c9c9,roughness:.9}));back.position.set(.75,0,-.002);back.rotation.y=Math.PI;pivot.add(back);
card.position.y=1.4;scene.add(card);
paint();
if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load('600 40px "Dancing Script"'),document.fonts.load('300 20px "Be Vietnam Pro"')]),new Promise(function(r){setTimeout(r,2500)})]).then(paint)}

/* Hoa 3D */
var pal=[[0xff7f9c,0xffe9a8],[0xffa66e,0xfff0c2],[0xb48cff,0xfff3b0],[0xffd84a,0xc2415f],[0xffffff,0xffc94d],[0xff5c82,0xfff0c2]],mats=[];
pal.forEach(function(p){var o=new T.Color(p[0]),i=o.clone().lerp(new T.Color(0xffffff),.35);
 mats.push({o:new T.MeshStandardMaterial({color:o,emissive:o,emissiveIntensity:.18,roughness:.55,side:T.DoubleSide}),i:new T.MeshStandardMaterial({color:i,emissive:i,emissiveIntensity:.15,roughness:.5,side:T.DoubleSide}),c:new T.MeshStandardMaterial({color:p[1],emissive:p[1],emissiveIntensity:.3,roughness:.6})})});
var sph=new T.SphereGeometry(1,10,6),stemM=new T.MeshStandardMaterial({color:0x4c9a5a,roughness:.8}),leafM=new T.MeshStandardMaterial({color:0x3f8a4f,roughness:.8,side:T.DoubleSide});
var flowers=[],cnt=document.getElementById("count");
function V(x,y,z){return new T.Vector3(x,y,z)}
function plant(x,z,start,h){
 var g=new T.Group(),m=mats[Math.floor(rnd(0,mats.length))];h=h||rnd(1.1,2.5);
 g.position.set(x,0,z);
 var dx=rnd(-.3,.3),dz=rnd(-.3,.3),cv=new T.QuadraticBezierCurve3(V(0,0,0),V(dx*.3,h*.55,dz*.3),V(dx,h,dz));
 g.add(new T.Mesh(new T.TubeGeometry(cv,10,.028,5),stemM));
 [.28,.5].forEach(function(u){var a=rnd(0,6.28),l=new T.Mesh(sph,leafM);l.scale.set(.1,.014,.28);l.position.copy(cv.getPoint(u)).add(V(Math.cos(a)*.14,0,Math.sin(a)*.14));l.rotation.order="YXZ";l.rotation.y=Math.PI/2-a;l.rotation.x=-.4;g.add(l)});
 var hd=new T.Group();hd.position.set(dx,h,dz);hd.rotation.set(dz*.7+rnd(-.15,.15),0,-dx*.7+rnd(-.15,.15));g.add(hd);
 var k=Math.floor(rnd(7,10)),sc=rnd(.85,1.3);
 for(var i=0;i<k;i++){var p=new T.Group();p.rotation.y=i/k*6.283;var q=new T.Mesh(sph,m.o);q.position.z=.3*sc;q.scale.set(.19*sc,.04,.34*sc);q.rotation.x=-.3;p.add(q);hd.add(p)}
 for(var i=0;i<k-2;i++){var p=new T.Group();p.rotation.y=(i+.5)/(k-2)*6.283;var q=new T.Mesh(sph,m.i);q.position.z=.17*sc;q.position.y=.03;q.scale.set(.13*sc,.035,.24*sc);q.rotation.x=-.8;p.add(q);hd.add(p)}
 var c=new T.Mesh(sph,m.c);c.scale.set(.13*sc,.08*sc,.13*sc);c.position.y=.05;hd.add(c);
 g.userData={s:start,ph:rnd(0,6.28),sp:rnd(.6,1.2)};g.scale.setScalar(.0001);scene.add(g);flowers.push(g);
 cnt.textContent=flowers.length+" bông hoa đang nở";
}
function easeBack(t){var c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}

/* Điều khiển camera + chạm */
var th=0,ph=1.38,rad=6.4,tgt=V(0,1.3,0),drag=null,moved=false,ray=new T.Raycaster(),mp=new T.Vector2();
var cv=renderer.domElement,opened=false,ot=0,hint=document.getElementById("hint");
function rs(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;rad=w/h<.8?8.4:6.4;cam.updateProjectionMatrix()}
addEventListener("resize",rs);rs();
cv.addEventListener("pointerdown",function(e){drag={x:e.clientX,y:e.clientY};moved=false;cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
cv.addEventListener("pointermove",function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
 if(moved){th=Math.max(-1.1,Math.min(1.1,th-dx*.005));ph=Math.max(1.05,Math.min(1.5,ph-dy*.004));drag={x:e.clientX,y:e.clientY}}});
cv.addEventListener("pointerup",function(e){cv.style.cursor="grab";if(drag&&!moved)tap(e);drag=null});
function tap(e){
 mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);
 var now=performance.now()/1000;
 if(!opened){if(ray.intersectObject(card,true).length){opened=true;ot=now;hint.style.opacity=0;
   var n=Math.round(rad>8?34:44);for(var i=0;i<n;i++){var r=rnd(2.3,10),a=rnd(0,6.283);plant(Math.cos(a)*r,Math.sin(a)*r,now+1.2+i*.09)}
   setTimeout(function(){hint.textContent="Chạm xuống mặt đất để trồng thêm hoa, kéo để xoay";hint.style.opacity=1},4800)}return}
 var pt=new T.Vector3();if(ray.ray.intersectPlane(new T.Plane(V(0,1,0),0),pt)&&pt.length()<12&&pt.length()>1.4&&pt.z>-20){plant(pt.x,pt.z,now);hint.style.opacity=0}
}
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&!opened){tap({clientX:innerWidth/2,clientY:innerHeight/2})}});

/* Vòng lặp */
function ioc(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function loop(ms){
 var t=ms/1000;
 var e=opened?ioc(Math.min((t-ot)/(reduce?.01:2.2),1)):0;
 pivot.rotation.y=-e*Math.PI*.93;card.position.x=.75*e;card.position.y=1.4+(reduce?0:Math.sin(t*1.2)*.04);
 card.rotation.y=opened?0:(reduce?0:Math.sin(t*.8)*.12);warm.intensity=e*1.3;
 for(var i=0;i<flowers.length;i++){var f=flowers[i],u=f.userData,p=(t-u.s)/(reduce?.01:1.9);
  if(p<=0){f.scale.setScalar(.0001);continue}
  f.scale.setScalar(Math.max(easeBack(Math.min(p,1)),.0001));
  f.rotation.z=reduce?0:Math.sin(t*u.sp+u.ph)*.03*Math.min(p,1)}
 for(var i=0;i<FN;i++){var b=fb[i];fp[i*3]=b[0]+Math.sin(t*b[4]+b[3])*.8;fp[i*3+1]=b[1]+Math.sin(t*b[4]*1.3+b[3])*.4;fp[i*3+2]=b[2]+Math.cos(t*b[4]+b[3])*.8}
 fg.attributes.position.needsUpdate=true;
 var a=th+(drag||reduce?0:Math.sin(t*.12)*.12);
 cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(a),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(a));
 cam.lookAt(tgt.x-.4*e,tgt.y,tgt.z);
 renderer.render(scene,cam);requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
