<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khu vườn hoa dành tặng em</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#f59b73;font-family:"Be Vietnam Pro",system-ui,sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
.ui{position:fixed;left:0;right:0;text-align:center;color:#fff;pointer-events:none;text-shadow:0 2px 12px rgba(73,35,47,.45)}
#title{top:calc(24px + env(safe-area-inset-top,0px));font-family:"Dancing Script",cursive;font-size:clamp(30px,5vw,52px);font-weight:600}
#subtitle{top:calc(82px + env(safe-area-inset-top,0px));font-size:12px;letter-spacing:.18em;text-transform:uppercase}
#hint{bottom:calc(48px + env(safe-area-inset-bottom,0px));font-size:14px;transition:opacity .6s;padding:12px 20px;width:max-content;max-width:calc(100% - 32px);left:50%;right:auto;transform:translateX(-50%);border:1px solid rgba(255,255,255,.55);border-radius:30px;background:rgba(91,53,48,.26);backdrop-filter:blur(8px)}
#count{bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.9}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="title" class="ui">Vườn tulip của riêng em</div>
<div id="subtitle" class="ui">Một góc nhỏ dành tặng Ngọc Nhi</div>
<div id="hint" class="ui">Chạm xuống đất để trồng thêm hoa · Kéo để xoay</div>
<div id="count" class="ui"></div>
<div id="err">Trình duyệt của bạn chưa hỗ trợ WebGL, hãy thử mở bằng Chrome hoặc Safari mới hơn.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var T=THREE, rnd=function(a,b){return a+Math.random()*(b-a)};
var renderer;
try{renderer=new T.WebGLRenderer({antialias:true})}catch(e){document.getElementById("err").style.display="flex";return}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=T.sRGBEncoding;
document.body.appendChild(renderer.domElement);
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Cánh đồng tulip lúc hoàng hôn */
var scene=new T.Scene(),cam=new T.PerspectiveCamera(50,1,.1,200);
var sk=document.createElement("canvas");sk.width=512;sk.height=256;
var sx=sk.getContext("2d"),gr=sx.createLinearGradient(0,0,0,256);
gr.addColorStop(0,"#f7b6a0");gr.addColorStop(.42,"#ffb273");gr.addColorStop(.72,"#f87967");gr.addColorStop(1,"#a84f69");
sx.fillStyle=gr;sx.fillRect(0,0,512,256);
var sunGlow=sx.createRadialGradient(256,210,4,256,210,130);
sunGlow.addColorStop(0,"rgba(255,245,190,.95)");sunGlow.addColorStop(.2,"rgba(255,205,126,.55)");sunGlow.addColorStop(1,"rgba(255,180,120,0)");
sx.fillStyle=sunGlow;sx.fillRect(100,50,312,206);
for(var cloud=0;cloud<9;cloud++){var cx=cloud*67-18,cy=54+(cloud%3)*27,cg=sx.createRadialGradient(cx,cy,2,cx,cy,54);cg.addColorStop(0,"rgba(255,218,191,.28)");cg.addColorStop(.55,"rgba(237,132,126,.13)");cg.addColorStop(1,"rgba(237,132,126,0)");sx.fillStyle=cg;sx.fillRect(cx-54,cy-24,108,48)}
var skyTex=new T.CanvasTexture(sk);skyTex.encoding=T.sRGBEncoding;
scene.background=skyTex;
scene.fog=new T.Fog(0xf5a07b,38,125);

/* Ánh sáng */
scene.add(new T.HemisphereLight(0xffe6cb,0x385d35,1.25));
var sunLight=new T.DirectionalLight(0xffd29b,2.1);sunLight.position.set(-16,18,-35);scene.add(sunLight);
function glowTex(c){var k=document.createElement("canvas");k.width=k.height=64;var x=k.getContext("2d"),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,c);g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(k)}
var sun=new T.Mesh(new T.SphereGeometry(3.2,24,16),new T.MeshBasicMaterial({color:0xffefbf,fog:false}));
sun.position.set(-8,18,-95);scene.add(sun);
var halo=new T.Sprite(new T.SpriteMaterial({map:glowTex("rgba(255,226,160,.9)"),fog:false,transparent:true,opacity:.7,depthWrite:false}));
halo.scale.set(28,28,1);halo.position.copy(sun.position);scene.add(halo);

/* Luống hoa chạy dài về phía chân trời */
var soil=new T.Mesh(new T.PlaneGeometry(110,115),new T.MeshStandardMaterial({color:0x3c5637,roughness:1}));
soil.rotation.x=-Math.PI/2;soil.position.set(0,-.08,-48);scene.add(soil);
var rowM=new T.MeshStandardMaterial({color:0x705043,roughness:1});
for(var r=-20.775;r<=19.8;r+=1.35){var furrow=new T.Mesh(new T.PlaneGeometry(.2,108),rowM);furrow.rotation.x=-Math.PI/2;furrow.position.set(r,0,-48);scene.add(furrow)}
var fieldColors=[0xff426a,0xff784d,0xffd74c,0xec45bd,0xff6680],stemGeo=new T.CylinderGeometry(.035,.055,.9,5);
var leafGeo=new T.SphereGeometry(1,8,5),petalGeo=new T.SphereGeometry(1,9,7),dummy=new T.Object3D();
var fieldCount=32*120,stems=new T.InstancedMesh(stemGeo,new T.MeshStandardMaterial({color:0x39834a,roughness:.85}),fieldCount);
var leaves=new T.InstancedMesh(leafGeo,new T.MeshStandardMaterial({color:0x438f4d,roughness:.8,side:T.DoubleSide}),fieldCount*2);
var buds=new T.InstancedMesh(petalGeo,new T.MeshStandardMaterial({color:0xffffff,roughness:.55,side:T.DoubleSide}),fieldCount*4);
var leafIndex=0,budIndex=0,fieldIndex=0;
for(var row=0;row<32;row++){var x=-21.45+row*1.35,color=new T.Color(fieldColors[Math.floor(row/4)%fieldColors.length]);
 for(var j=0;j<120;j++){var z=4-j*.82+((row%2)*.18),h=.65+rnd(.0,.28);
  dummy.position.set(x,h*.48,z);dummy.scale.set(1,h,1);dummy.rotation.set(0,0,0);dummy.updateMatrix();stems.setMatrixAt(fieldIndex,dummy.matrix);
  for(var side=-1;side<=1;side+=2){dummy.position.set(x+side*.11,.25,z);dummy.rotation.set(0,0,side*.42);dummy.scale.set(.12,.025,.42);dummy.updateMatrix();leaves.setMatrixAt(leafIndex++,dummy.matrix)}
  for(var p=0;p<4;p++){var a=p*Math.PI/2;dummy.position.set(x+Math.cos(a)*.075,h+.05+Math.sin(a)*.035,z+Math.sin(a)*.075);dummy.rotation.set(Math.sin(a)*.24,0,-Math.cos(a)*.24);dummy.scale.set(.105,.24,.085);dummy.updateMatrix();buds.setMatrixAt(budIndex,dummy.matrix);buds.setColorAt(budIndex++,color)}
  fieldIndex++;
 }}
scene.add(stems,leaves,buds);
stems.instanceMatrix.needsUpdate=true;leaves.instanceMatrix.needsUpdate=true;buds.instanceMatrix.needsUpdate=true;
var millX=22,millZ=-58;
var tower=new T.Mesh(new T.CylinderGeometry(.38,.76,9.5,6),new T.MeshStandardMaterial({color:0xe9c9a0,roughness:.9}));
tower.position.set(millX,4.75,millZ);scene.add(tower);
var millHub=new T.Mesh(new T.SphereGeometry(.38,12,8),new T.MeshStandardMaterial({color:0x684d3d,roughness:.8}));
millHub.position.set(millX,9.5,millZ+.55);scene.add(millHub);
var bladeM=new T.MeshStandardMaterial({color:0x725441,roughness:.8});
for(var blade=0;blade<4;blade++){var wing=new T.Mesh(new T.BoxGeometry(.24,5.5,.16),bladeM);wing.position.set(millX,9.5,millZ+.65);wing.rotation.z=blade*Math.PI/2+.24;scene.add(wing)}

/* Hoa 3D */
var pal=[[0xff426a,0xffe9a8],[0xff784d,0xfff0c2],[0xffcf43,0xfff3b0],[0xec45bd,0xfff0c2],[0xff6680,0xffc94d]],mats=[];
pal.forEach(function(p){var o=new T.Color(p[0]),i=o.clone().lerp(new T.Color(0xffffff),.35);
 mats.push({o:new T.MeshStandardMaterial({color:o,emissive:o,emissiveIntensity:.18,roughness:.55,side:T.DoubleSide}),i:new T.MeshStandardMaterial({color:i,emissive:i,emissiveIntensity:.15,roughness:.5,side:T.DoubleSide}),c:new T.MeshStandardMaterial({color:p[1],emissive:p[1],emissiveIntensity:.3,roughness:.6})})});
var sph=new T.SphereGeometry(1,10,6),stemM=new T.MeshStandardMaterial({color:0x4c9a5a,roughness:.8}),leafM=new T.MeshStandardMaterial({color:0x3f8a4f,roughness:.8,side:T.DoubleSide});
var flowers=[],cnt=document.getElementById("count");
cnt.textContent=fieldCount.toLocaleString("vi-VN")+" bông tulip đang khoe sắc";
function V(x,y,z){return new T.Vector3(x,y,z)}
function plant(x,z,start,h){
 var g=new T.Group(),m=mats[Math.floor(rnd(0,mats.length))];h=h||rnd(.9,1.5);
 var sc=rnd(.85,1.3);
 g.position.set(x,0,z);
 var dx=rnd(-.3,.3),dz=rnd(-.3,.3),cv=new T.QuadraticBezierCurve3(V(0,0,0),V(dx*.3,h*.55,dz*.3),V(dx,h,dz));
 g.add(new T.Mesh(new T.TubeGeometry(cv,10,.028,5),stemM));
 [.28,.5].forEach(function(u){var a=rnd(0,6.28),l=new T.Mesh(sph,leafM);l.scale.set(.1,.014,.28);l.position.copy(cv.getPoint(u)).add(V(Math.cos(a)*.14,0,Math.sin(a)*.14));l.rotation.order="YXZ";l.rotation.y=Math.PI/2-a;l.rotation.x=-.4;g.add(l)});
 var hd=new T.Group();hd.position.set(dx,h,dz);hd.rotation.set(dz*.7+rnd(-.15,.15),0,-dx*.7+rnd(-.15,.15));g.add(hd);
 for(var i=0;i<5;i++){var p=new T.Group();p.rotation.y=i/5*6.283;var q=new T.Mesh(sph,m.o);q.position.set(0,.2*sc,.1*sc);q.scale.set(.15*sc,.29*sc,.11*sc);q.rotation.x=-.12;p.add(q);hd.add(p)}
 for(var i=0;i<3;i++){var p=new T.Group();p.rotation.y=(i+.5)/3*6.283;var q=new T.Mesh(sph,m.i);q.position.set(0,.2*sc,.035*sc);q.scale.set(.115*sc,.24*sc,.09*sc);p.add(q);hd.add(p)}
 var c=new T.Mesh(sph,m.c);c.scale.set(.07*sc,.09*sc,.07*sc);c.position.y=.13;hd.add(c);
 g.userData={s:start,ph:rnd(0,6.28),sp:rnd(.6,1.2)};g.scale.setScalar(.0001);scene.add(g);flowers.push(g);
 cnt.textContent=(fieldCount+flowers.length).toLocaleString("vi-VN")+" bông tulip đang khoe sắc";
}
function easeBack(t){var c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}

/* Điều khiển camera + chạm */
var th=0,ph=1.326,rad=10.3,tgt=V(0,2.2,0),drag=null,moved=false,ray=new T.Raycaster(),mp=new T.Vector2();
var cv=renderer.domElement,hint=document.getElementById("hint");
function rs(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;rad=w/h<.8?11.8:10.3;cam.updateProjectionMatrix()}
addEventListener("resize",rs);rs();
cv.addEventListener("pointerdown",function(e){drag={x:e.clientX,y:e.clientY};moved=false;cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
cv.addEventListener("pointermove",function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
 if(moved){th=Math.max(-1.1,Math.min(1.1,th-dx*.005));ph=Math.max(1.05,Math.min(1.5,ph-dy*.004));drag={x:e.clientX,y:e.clientY}}});
cv.addEventListener("pointerup",function(e){cv.style.cursor="grab";if(drag&&!moved)tap(e);drag=null});
function tap(e){
 mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);
 var now=performance.now()/1000;
 var pt=new T.Vector3();if(ray.ray.intersectPlane(new T.Plane(V(0,1,0),0),pt)&&Math.abs(pt.x)<45&&pt.z>-100&&pt.z<6){plant(pt.x,pt.z,now);hint.style.opacity=0}
}

/* Vòng lặp */
function loop(ms){
 var t=ms/1000;
 for(var i=0;i<flowers.length;i++){var f=flowers[i],u=f.userData,p=(t-u.s)/(reduce?.01:1.9);
  if(p<=0){f.scale.setScalar(.0001);continue}
  f.scale.setScalar(Math.max(easeBack(Math.min(p,1)),.0001));
  f.rotation.z=reduce?0:Math.sin(t*u.sp+u.ph)*.03*Math.min(p,1)}
 var a=th+(drag||reduce?0:Math.sin(t*.12)*.12);
 cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(a),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(a));
 cam.lookAt(tgt);
 renderer.render(scene,cam);requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
